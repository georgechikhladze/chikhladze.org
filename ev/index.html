<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>EvMusic</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="./content/style.css">
</head>
<body>

<div class="layout">
	<aside class="sidebar" id="sidebar">
		<div class="sidebar-logo">Ev<span>Music</span></div>

		<nav class="sidebar-nav">
			<div class="nav-item active" data-view="all">
				<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
				Library
			</div>
			<div class="nav-item" data-view="favourites">
				<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
				Favourites
			</div>
		</nav>

		<div class="sidebar-section">Filters</div>
		<nav class="sidebar-nav">
			<div class="nav-item filter-item" data-type="Studio">
				<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>
				Studio
			</div>
			<div class="nav-item filter-item" data-type="Live">
				<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
				Live
			</div>
			<div class="nav-item filter-item" data-type="Demo">
				<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
				Demos
			</div>
			<div class="nav-item filter-item" data-type="Compilation">
				<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
				Compilations
			</div>
			<div class="nav-item filter-item" data-type="Amy Lee">
				<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
				Amy Lee
			</div>
		</nav>

		<div class="sidebar-footer">
			Evanescence<br>Complete Discography
		</div>
	</aside>

	<div class="main">
		<div class="main-header">
			<div class="main-header-left">
				<button class="menu-btn" id="menu-btn" aria-label="Menu">
					<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
				</button>
				<div>
					<div class="main-title" id="main-title">All tracks</div>
					<div class="main-sub" id="main-sub">Loading...</div>
				</div>
			</div>
			<div class="header-right">
				<div class="header-search">
					<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
					<input type="text" id="search-input" placeholder="Search tracks..." autocomplete="off">
				</div>
				<button class="theme-btn" id="theme-btn" aria-label="Toggle theme" title="Toggle theme">
					<svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
					<svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
				</button>
			</div>
		</div>

		<div id="app-content">
			<div class="section-label">Albums</div>
			<div class="albums-row" id="albums-row"></div>

			<div class="section-label" style="margin-top:20px">Tracks</div>
			<div class="tracklist-container">
				<div class="tracklist-header">
					<div class="th-num">#</div>
					<div class="th-title">Title</div>
					<div class="th-album">Album</div>
					<div class="th-dur">
						<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
					</div>
				</div>
				<div id="tracklist"></div>
			</div>
		</div>
	</div>
</div>

<div class="player-bar" id="player-bar">
	<div class="now-playing" id="now-playing">
		<div class="np-cover" id="np-cover">
			<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><line x1="12" y1="3" x2="12" y2="9"/></svg>
		</div>
		<div class="np-info">
			<div class="np-title" id="np-title">Not playing</div>
			<div class="np-artist" id="np-artist">—</div>
		</div>
		<button class="np-like" id="np-like" aria-label="Like">
			<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
		</button>
	</div>

	<div class="player-center">
		<div class="ctrl-btns">
			<button class="ctrl-btn" id="btn-shuffle" aria-label="Shuffle">
				<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
			</button>
			<button class="ctrl-btn ctrl-prev" id="btn-prev" aria-label="Previous">
				<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
			</button>
			<button class="ctrl-btn-play" id="btn-play" aria-label="Play/Pause">
				<svg id="play-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
			</button>
			<button class="ctrl-btn ctrl-next" id="btn-next" aria-label="Next">
				<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
			</button>
			<button class="ctrl-btn" id="btn-repeat" aria-label="Repeat">
				<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
			</button>
		</div>
		<div class="timeline-wrap">
			<span class="time-label" id="t-cur">0:00</span>
			<div class="timeline-track" id="tl-track">
				<div class="timeline-fill" id="tl-fill"></div>
				<div class="timeline-thumb" id="tl-thumb"></div>
			</div>
			<span class="time-label" id="t-dur">0:00</span>
		</div>
	</div>

	<div class="vol-side">
		<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
		<input type="range" id="vol-slider" min="0" max="100" value="60" aria-label="Volume">
	</div>
</div>

<div class="sidebar-overlay" id="sidebar-overlay"></div>

<script src="./database/db.js"></script>
<script src="./content/main.js"></script>
<script src="./content/player.js"></script>
</body>
</html>
